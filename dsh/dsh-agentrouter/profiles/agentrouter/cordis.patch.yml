# AgentRouter profile: all providers + agentrouter route.
# 元は AgentRouter の日本語プロンプト content-block 回避のため agent-instructions を
# 無効化していた。ただしこの行が無効化するのはトップレベルの row のみで、実際の
# セッションは agent-preset (standard 等) 内の同名 row が指示を読む（実測）。
# 現在は ~/.agents/AGENTS.md（日本語含む）を読んでも動作している。
# 共有指示の正本は ~/.agents/AGENTS.md、全プロバイダは web プロファイルから流用。
- id: agent-instructions
  disabled: true
# モデル選択メニューの「エージェント連携を有効にする」を新規セッションで既定ONにする。
# config は丸ごと置換されるため base の maxTasks: 256 も併記する。
# 既存セッションの保存済み選択は上書きしない（ドキュメント仕様）。
- id: agent-team
  name: '@deepseek-ai/dsh-agent-team'
  config:
    maxTasks: 256
    defaultEnabled: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go
    model: hy4-flash-free
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: opencode-go
        model: hy4-flash-free

- insert:
    - id: mcp-github
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: streamable-http
        url: https://api.githubcopilot.com/mcp/
        headers:
          X-MCP-Toolsets: repos,pull_requests,issues
          Authorization: !!js '`Bearer ${process.env.GITHUB_MCP_TOKEN}`'
        toolCallTimeoutMs: 60000
        failOnStartupError: false

- insert:
    - id: mcp-jarvis
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: jarvis
        transport: streamable-http
        url: http://127.0.0.1:8082/mcp
        toolCallTimeoutMs: 60000
        failOnStartupError: false

- insert:
    - id: mcp-rustxng
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rustxng
        transport: stdio
        command: /home/koppe/.local/bin/rustxng
        args:
          - mcp
        toolCallTimeoutMs: 60000
        failOnStartupError: false
- id: subagent
  name: "@deepseek-ai/dsh-subagent"
  config:
    maxActiveSubagents: 80
    maxDepth: 80

# スマホ通知 (dsh-ntfy-notify): 承認待ちだけを ntfy に流す。
# ターン完了・質問は dsh-mobile-maxxing の Web Push（アプリ内バナー/タップで開く）が担当。
# Web Push が Android 実機で動かない場合は notifyQuestion / notifyTurnComplete を true に戻す。
- id: ntfy-notify
  config:
    server: 'https://ntfy.sh'
    clickUrl: 'https://onoderakeita-systemproductname.tailb706b0.ts.net:8445/'
    topic: 'LZYVQrZ5hf754ZUQkLYGLPFEX'
    sound: true
    notifyApproval: true
    notifyQuestion: false
    notifyTurnComplete: false
    approvalPriority: 'max'
    questionPriority: 'max'
    turnPriority: 'high'
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access

# DeepSeek の web search は使用しない（調査は MCP の jarvis web_search を使う）
- id: web-search-deepseek
  disabled: true
