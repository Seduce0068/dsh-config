# Providers routed through dsh-llm-pi-ai.
# Credentials are read from EnvironmentFile=<home>/.config/opencode/dsh.env.
# モデル選択メニューの「エージェント連携を有効にする」を新規セッションで既定ONにする。
# config は丸ごと置換されるため base の maxTasks: 256 も併記する。
