- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access

# スマホ通知 (dsh-ntfy-notify): 承認待ちのみ ntfy。質問・ターン完了は Web Push が担当。
# 方針は旧 agentrouter プロファイルと同じ。Web Push が届かない場合は notifyQuestion を true に戻す。
- id: ntfy-notify
  config:
    server: 'https://ntfy.sh'
    clickUrl: 'https://<host>.<tailnet>:8445/'
    topic: 'LZYVQrZ5hf754ZUQkLYGLPFEX'
    sound: true
    notifyApproval: true
    notifyQuestion: false
    notifyTurnComplete: false
    approvalPriority: 'max'
    questionPriority: 'max'
    turnPriority: 'high'
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    models: []

- insert:
    - id: mcp-github
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: streamable-http
        url: https://api.githubcopilot.com/mcp/
        headers:
          X-MCP-Toolsets: repos,pull_requests,issues
          Authorization: !!js '`Bearer ${process.env.GITHUB_MCP_TOKEN}`'
        toolCallTimeoutMs: 60000
        failOnStartupError: false

- insert:
    - id: mcp-jarvis
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: jarvis
        transport: streamable-http
        url: http://127.0.0.1:8082/mcp
        toolCallTimeoutMs: 60000
        failOnStartupError: false

    - id: mcp-rustxng
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rustxng
        transport: stdio
        command: <home>/.local/bin/rustxng
        args:
          - mcp
        toolCallTimeoutMs: 60000
        failOnStartupError: false

# DeepSeek の web search は使用しない（調査は MCP の jarvis web_search を使う）
- id: web-search-deepseek
  disabled: true

# MCP: exa (web search/fetch) — streamable-http, keyless (free rate limit).
# 認証: OAuth は DSH 未対応のため keyless で接続。キーを使う場合は
# dsh.env に EXA_API_KEY を追加し、headers に
# x-api-key: !!js process.env.EXA_API_KEY
# を追加する（README: API key mode / https://mcp.exa.ai/mcp）。
- insert:
    - id: mcp-exa
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: exa
        transport: streamable-http
        url: https://mcp.exa.ai/mcp
        toolCallTimeoutMs: 60000
        failOnStartupError: false

# MCP: tavily (search/extract) — streamable-http, keyless header 必須.
# 認証: X-Tavily-Access-Mode: keyless ヘッダーがないと 401。
# crawl/map/research はキー必須: dsh.env に TAVILY_API_KEY を追加し headers に
# Authorization: !!js '`Bearer ${process.env.TAVILY_API_KEY}`'
# を追加（キーが優先される）。
- insert:
    - id: mcp-tavily
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: tavily
        transport: streamable-http
        url: https://mcp.tavily.com/mcp/
        headers:
          X-Tavily-Access-Mode: keyless
        toolCallTimeoutMs: 60000
        failOnStartupError: false

# MCP: context7 (library docs) — streamable-http, keyless (rate limited).
# キーを使う場合は dsh.env に CONTEXT7_API_KEY を追加し、
# url を !!js '`https://mcp.context7.com/mcp?api_key=${process.env.CONTEXT7_API_KEY}`'
# に差し替える。
- insert:
    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
        toolCallTimeoutMs: 60000
        failOnStartupError: false
- id: speech-to-text
  name: "@deepseek-ai/dsh-experimental-speech-to-text"
  config:
    defaultProvider: sensevoice-local
    language: ja
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: opencode-go
        model: opencode-go/beam-free
      - provider: opencode-go
        model: opencode-go/hungerg-free
      - provider: opencode-go
        model: opencode-go/hy4-flash-free
      - provider: opencode-go
        model: opencode-go/iceman-contributor-free
      - provider: opencode-go
        model: opencode-go/deepseek-v4.1-flash
      - provider: opencode-go
        model: opencode-go/glm-5.3
- id: subagent
  name: "@deepseek-ai/dsh-subagent"
  config:
    maxDepth: 5000
    maxActiveSubagents: 5000
- id: agent-loop
  name: "@deepseek-ai/dsh-agent-loop"
  config:
    agents: []
    maxParallelToolCalls: 5000
