- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access

# スマホ通知 (dsh-ntfy-notify): 承認待ち・質問待ち・ターン完了を ntfy で転送
- id: ntfy-notify
  config:
    server: 'https://ntfy.sh'
    topic: 'LZYVQrZ5hf754ZUQkLYGLPFEX'
    sound: true
    # 承認待ち・質問待ちは最強（5）で DND も突破、ターン完了はポップアップ（4）
    approvalPriority: 'max'
    questionPriority: 'max'
    turnPriority: 'high'
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    models: []

- insert:
    - id: mcp-github
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: streamable-http
        url: https://api.githubcopilot.com/mcp/
        headers:
          X-MCP-Toolsets: repos,pull_requests,issues
          Authorization: !!js '`Bearer ${process.env.GITHUB_MCP_TOKEN}`'
        toolCallTimeoutMs: 60000
        failOnStartupError: false
