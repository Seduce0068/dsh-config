# AgentRouter profile: no user-global instructions.
# AgentRouter rejects requests whose prompt contains Japanese text
# (`content-blocked`), so this profile disables agent-instructions entirely.
# The default web profile keeps the Japanese AGENTS.md.
- id: agent-instructions
  disabled: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: agentrouter
    model: gpt-5.6-sol
