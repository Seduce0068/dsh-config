# headless プロファイル: 既定モデルを opencode-go / deepseek-v4.1-flash にする。
# headless は既定で managed credential store を無効化するため、認証は起動環境
# （~/.config/opencode/dsh.env を source するか、$DSH_HOME/.env）から供給する。
# 参考: @deepseek-ai/dsh-headless README「Credentials」
- id: llm-pi-ai
  config:
    providers:
      opencode-go:
        displayName: OpenCode Go
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        headers:
          x-opencode-session: dsh
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1048576
            maxTokens: 131072
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
            contextWindow: 1000000
            maxTokens: 384000
- id: agent-default-model
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash

# DeepSeek の web search は使用しない（調査は MCP の jarvis web_search を使う）
- id: web-search-deepseek
  disabled: true
