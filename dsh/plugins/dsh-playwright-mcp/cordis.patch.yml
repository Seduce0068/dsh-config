- insert:
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: npx
        args:
          - -y
          - '@playwright/mcp@latest'
          - --browser
          - chromium
          - --headless
        startupTimeoutMs: 180000
        toolCallTimeoutMs: 120000
        failOnStartupError: false
