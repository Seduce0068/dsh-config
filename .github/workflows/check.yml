name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Shell syntax
        run: |
          bash -n tools/export-instructions.sh
          bash -n tools/check-config.sh
      - name: Config & link check
        run: bash tools/check-config.sh
      - name: Secret scan (tracked files)
        run: |
          python3 - <<'PY'
          import re, subprocess, pathlib
          pats = [re.compile(r'github_pat_[A-Za-z0-9_]{30,}'),
                  re.compile(r'ghp_[A-Za-z0-9]{30,}'),
                  re.compile(r'sk-[A-Za-z0-9]{30,}'),
                  re.compile(r'AKIA[0-9A-Z]{16}'),
                  re.compile(r'-----BEGIN [A-Z ]*PRIVATE KEY-----')]
          hits = []
          for rel in subprocess.run(['git','ls-files'], capture_output=True, text=True).stdout.splitlines():
              p = pathlib.Path(rel)
              if not p.is_file() or p.stat().st_size > 1024 * 1024:
                  continue
              t = p.read_text(errors='ignore')
              if any(rx.search(t) for rx in pats):
                  hits.append(rel)
          if hits:
              print('secret-like content:', hits)
              raise SystemExit(1)
          print('secret scan: OK')
          PY
